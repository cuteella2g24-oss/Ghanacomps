name = "ghanacomps"
compatibility_date = "2026-07-26"
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* runs the Worker first (KV content API); everything else is served as a
# static asset, with the SPA fallback for react-router deep links.
run_worker_first = ["/api/*"]

# Content store. Create the namespace once, then paste its id here:
#   npx wrangler kv namespace create CONTENT
# See docs/CMS_SETUP.md for the full one-time setup.
[[kv_namespaces]]
binding = "CONTENT"
id = "61ffe9b27def434daa6c826c12ae2b39"
